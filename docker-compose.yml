name: supportroom-local

x-database-environment: &database-environment
  POSTGRES_DB: ${LOCAL_POSTGRES_DB:-supportroom}
  POSTGRES_USER: ${LOCAL_POSTGRES_USER:-supportroom}
  POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-supportroom-local-only}

x-application-database: &application-database
  POSTGRES_CONNECTION_STRING: Host=postgres;Port=5432;Database=${LOCAL_POSTGRES_DB:-supportroom};Username=${LOCAL_POSTGRES_USER:-supportroom};Password=${LOCAL_POSTGRES_PASSWORD:-supportroom-local-only}

services:
  postgres:
    image: postgres:16-alpine
    environment: *database-environment
    ports:
      - "${LOCAL_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      target: migrations
    environment:
      <<: *application-database
      DOTNET_ENVIRONMENT: Development
    command:
      - database
      - update
      - --project
      - src/SupportRoom.Providers.Data/SupportRoom.Providers.Data.csproj
      - --startup-project
      - src/SupportRoom.Api/SupportRoom.Api.csproj
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
      target: runtime
    env_file:
      - ./backend/src/SupportRoom.Api/.env
    environment:
      <<: *application-database
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ALLOWED_ORIGINS: http://localhost:${LOCAL_FRONTEND_PORT:-3000}
      LOCAL_STORAGE_PATH: /app/storage
    ports:
      - "${LOCAL_BACKEND_PORT:-5138}:8080"
    volumes:
      - api-logs:/app/logs
      - api-storage:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${LOCAL_BACKEND_PORT:-5138}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${LOCAL_FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
  api-logs:
  api-storage:
